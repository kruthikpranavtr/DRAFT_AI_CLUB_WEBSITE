<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <style>html,body{background:#000!important;color:#fff}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CLUB — Sri Shakthi Institute of Engineering and Technology</title>
    <meta name="description" content="Official web application for the AI Club at Sri Shakthi Institute of Engineering and Technology. Explore projects, workshops, hackathons, achievements, and our interactive AI assistant." />
    <meta name="keywords" content="AI Club, Sri Shakthi, Artificial Intelligence, Machine Learning, Deep Learning, Hackathons, Workshops" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      /* THEME PRE-PAINT — prevents flash of light/dark mode */
      try {
        var t = localStorage.getItem('aiclub-theme');
        if (t) {
          document.documentElement.dataset.theme = t;
        } else {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body style="background:#000;color:#fff">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
